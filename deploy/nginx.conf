server {
  listen 80;
  server_name _;
  client_max_body_size 10m;
  server_tokens off;
  autoindex off;
  # Requires deploy/security/probe-log.conf included in http {} first.
  # Keep routine scanner noise out of the general access log. A minimal,
  # value-free line is still written to the dedicated probe log so Fail2ban
  # can count offenders without retaining attacker-controlled request data.
  access_log /var/log/nginx/access.log combined if=$log_regular_access;
  access_log /var/log/nginx/honeypot-probes.log decoy_probe if=$is_decoy_probe;

  # Normalize security headers at the reverse-proxy boundary. DENY is stricter
  # than SAMEORIGIN and matches the application's frame-ancestors policy.
  proxy_hide_header X-Frame-Options;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header X-XSS-Protection;
  proxy_hide_header X-Powered-By;
  proxy_hide_header X-AspNet-Version;
  proxy_hide_header X-AspNetMvc-Version;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-XSS-Protection "1; mode=block" always;

  # Scanner addresses observed by the honeypot. Host-level UFW rules should
  # mirror these denies when the production server is administered directly.
  deny 91.92.241.196;
  deny 136.110.69.22;
  deny 146.70.134.142;
  deny 195.178.110.72;
  deny 45.115.26.203;
  # INC-2026-000132/134/135/144
  deny 142.93.0.66;
  deny 159.65.18.197;
  deny 159.65.144.72;
  deny 130.12.180.117;

  # Server rewrite phase: cannot be bypassed by a later ^~ or regex location.
  # This server has no legitimate WordPress/PHP or dotfile routes.
  if ($uri ~* "^/(?:wp-admin(?:/|$)|wp-login\.php(?:/|$)|wordpress(?:/|$)|(?:info|phpinfo|test|env|index)\.php$|graphql(?:/|$)|api/gql(?:/|$)|admin/[^/]+\.json$|actuator(?:/|$)|\.(?:env|git|vscode|idea|svn)(?:[./]|$))") {
    return 444;
  }

  # No PHP, ASP or JSP application is served by this reverse proxy.
  if ($uri ~* "\.(?:php|asp|aspx|jsp)(?:/|$)") {
    return 444;
  }

  # Do not proxy hidden files/directories (except ACME challenges) or common
  # backup/config/database dump extensions to any upstream application.
  location ~* (^|/)\.(?!well-known(?:/|$)) {
    log_not_found off;
    return 404;
  }

  location ~* \.(?:env|bak|old|orig|save|sql|dump|tar|gz|zip|log|ini|yml|yaml)$ {
    log_not_found off;
    return 404;
  }

  # Close connections for common malware and control-panel probe filenames.
  # Keep these requests in the access log so Fail2ban can count and ban them.
  location ~* /(?:bot-connect|bot|c2|shell|alfa|wso|pma|phpmyadmin|adminer)\.(?:js|php|asp|aspx|sh)$ {
    log_not_found off;
    return 444;
  }

  location /evolution/ {
    proxy_pass http://evolution-api:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }

  location / {
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 60s;
  }
}
