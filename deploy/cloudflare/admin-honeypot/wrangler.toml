name = "renvix-admin-honeypot"
main = "src/worker.js"
compatibility_date = "2026-08-01"
workers_dev = false

routes = [
  { pattern = "admin.renvix.app/*", zone_name = "renvix.app" }
]

[vars]
SECURITY_INGESTION_URL = "https://api.renvix.app/api/security/ingest/honeypot"
# Account-wide IP bans fail closed until a real account ID, API token secret,
# and at least one exact trusted test IP are configured.
EDGE_AUTO_BLOCK = "true"
CF_ACCOUNT_ID = "REPLACE_WITH_ACCOUNT_ID"
# Comma-separated exact CF-Connecting-IP values exempt from account-wide bans.
TRUSTED_TEST_IPS = ""

[[durable_objects.bindings]]
name = "EDGE_BANS"
class_name = "EdgeBan"

[[migrations]]
tag = "edge-ban-v1"
new_sqlite_classes = ["EdgeBan"]

[[unsafe.bindings]]
name = "HONEYPOT_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
