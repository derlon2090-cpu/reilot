name = "renvix-admin-honeypot"
main = "src/worker.js"
compatibility_date = "2026-08-01"
workers_dev = false

routes = [
  { pattern = "admin.renvix.app/*", zone_name = "renvix.app" }
]

[vars]
SECURITY_INGESTION_URL = "https://api.renvix.app/api/security/ingest/honeypot"
# Local Durable Object IP blocks work without API credentials. These settings
# enable the optional account-wide Cloudflare rule when the token is present.
EDGE_AUTO_BLOCK = "true"
CF_ACCOUNT_ID = "e87f5f036618c196f98b927f238ed179"
# Comma-separated exact CF-Connecting-IP values exempt from account-wide bans.
TRUSTED_TEST_IPS = "37.243.1.54"

[[durable_objects.bindings]]
name = "EDGE_BANS"
class_name = "EdgeBan"

[[migrations]]
tag = "edge-ban-v1"
new_sqlite_classes = ["EdgeBan"]

[[unsafe.bindings]]
name = "HONEYPOT_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
