upstream renvix_app {
  zone renvix_app 64k;
  server app:3000 max_fails=3 fail_timeout=10s;
  keepalive 64;
}

upstream evolution_backend {
  zone evolution_backend 64k;
  server evolution-api:8080 max_fails=3 fail_timeout=10s;
  keepalive 32;
}

# Reject unknown Host headers, direct-IP virtual hosts, and Cloudflare zones
# that are not owned by Renvix. The origin firewall/AOP remains the primary
# origin-authentication control.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name "";
  access_log off;
  return 444;
}

server {
  listen 80;
  listen [::]:80;
  server_name renvix.app www.renvix.app accounts.renvix.app dash.renvix.app api.renvix.app wa-admin.renvix.app;
  client_max_body_size 10m;
  client_body_buffer_size 64k;
  client_body_timeout 15s;
  client_header_timeout 10s;
  client_header_buffer_size 4k;
  large_client_header_buffers 4 16k;
  keepalive_timeout 15s;
  keepalive_requests 500;
  send_timeout 30s;
  reset_timedout_connection on;
  server_tokens off;
  autoindex off;

  # Bound per-client work at the last proxy hop. Cloudflare edge controls are
  # still required for volumetric and distributed attacks.
  limit_conn renvix_per_ip 30;
  limit_conn_status 429;
  limit_req zone=renvix_general burst=120 nodelay;
  limit_req zone=renvix_auth burst=10 nodelay;
  limit_req_status 429;
  limit_req_log_level warn;
  # Requires deploy/security/probe-log.conf included in http {} first.
  # Keep routine scanner noise out of the general access log. A minimal,
  # value-free line is still written to the dedicated probe log so Fail2ban
  # can count offenders without retaining attacker-controlled request data.
  access_log /var/log/nginx/access.log combined if=$log_regular_access;
  access_log /var/log/nginx/honeypot-probes.log decoy_probe if=$is_decoy_probe;

  # Normalize security headers at the reverse-proxy boundary. DENY is stricter
  # than SAMEORIGIN and matches the application's frame-ancestors policy.
  proxy_hide_header X-Frame-Options;
  proxy_hide_header X-Content-Type-Options;
  proxy_hide_header Referrer-Policy;
  proxy_hide_header X-XSS-Protection;
  proxy_hide_header X-Powered-By;
  proxy_hide_header X-AspNet-Version;
  proxy_hide_header X-AspNetMvc-Version;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-XSS-Protection "1; mode=block" always;

  # Scanner addresses observed by the honeypot. Host-level UFW rules should
  # mirror these denies when the production server is administered directly.
  deny 91.92.241.196;
  deny 136.110.69.22;
  deny 146.70.134.142;
  deny 195.178.110.72;
  deny 45.115.26.203;
  # INC-2026-000132/134/135/144
  deny 142.93.0.66;
  deny 159.65.18.197;
  deny 159.65.144.72;
  deny 130.12.180.117;
  deny 147.182.200.94;
  deny 138.197.191.87;
  deny 34.140.132.132;
  deny 91.148.245.81;

  # Reject unsupported tunnel/trace methods in the server rewrite phase.
  if ($request_method ~* "^(?:TRACE|CONNECT)$") {
    return 444;
  }

  # Latest incident families. Do not spend disk I/O on commodity probes.
  # Regex locations are ordered: keep this before the broader probe rules.
  location ~* ^/(?:\.vscode(?:/|$)|\.env(?:[./]|$)|info\.php$|api/gql(?:/|$)|actuator(?:/|$)|\.well-known/security\.txt$|storage/logs(?:/|$)|zzcanary-[^/]*\.xml$) {
    access_log off;
    log_not_found off;
    return 444;
  }

  # Other reserved scanner routes remain eligible for the bounded Fail2ban
  # telemetry log configured above.
  location ~* ^/(?:wp-admin(?:/|$)|wp-login\.php(?:/|$)|wordpress(?:/|$)|(?:phpinfo|test|env|index)\.php$|graphql(?:/|$)|admin/[^/]+\.json$|\.(?:git|idea|svn)(?:[./]|$)) {
    return 444;
  }

  # No PHP, ASP or JSP application is served by this reverse proxy.
  location ~* \.(?:php|asp|aspx|jsp)(?:/|$) {
    return 444;
  }

  # Do not proxy hidden files/directories (except ACME challenges) or common
  # backup/config/database dump extensions to any upstream application.
  location ~* (^|/)\.(?!well-known(?:/|$)) {
    log_not_found off;
    return 404;
  }

  location ~* \.(?:env|bak|old|orig|save|sql|dump|tar|gz|zip|log|ini|yml|yaml)$ {
    log_not_found off;
    return 404;
  }

  # Close connections for common malware and control-panel probe filenames.
  # Keep these requests in the access log so Fail2ban can count and ban them.
  location ~* /(?:bot-connect|bot|c2|shell|alfa|wso|pma|phpmyadmin|adminer)\.(?:js|php|asp|aspx|sh)$ {
    log_not_found off;
    return 444;
  }

  location /evolution/ {
    proxy_pass http://evolution_backend/;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
    proxy_request_buffering on;
    proxy_next_upstream off;
  }

  location / {
    proxy_pass http://renvix_app;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 60s;
    proxy_request_buffering on;
    proxy_next_upstream off;
  }
}
