# Include inside http {}, NOT server {}. Immediate writes for Fail2ban.
map $uri $is_decoy_probe {
    default 0;
    ~*^/(?:wp-admin(?:/|$)|wp-login\.php(?:/|$)|wordpress(?:/|$)|(?:info|phpinfo|test|env|index)\.php$|graphql(?:/|$)|admin/[^/]+\.json$|actuator(?:/|$)|\.(?:env|git|vscode|idea|svn)(?:[./]|$)) 1;
}
log_format decoy_probe '$remote_addr [$time_local] probe status=$status';
# Add this access_log in each protected server {} alongside its normal log:
# access_log /var/log/nginx/honeypot-probes.log decoy_probe if=$is_decoy_probe;
