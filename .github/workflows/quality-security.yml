name: Quality and Security

"on":
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

# Public canonical origins are required while Next.js prerenders metadata.
env:
  NEXT_PUBLIC_SITE_URL: https://renvix.app
  NEXT_PUBLIC_AUTH_URL: https://accounts.renvix.app
  NEXT_PUBLIC_APP_URL: https://dash.renvix.app
  NEXT_PUBLIC_ADMIN_URL: https://wa-admin.renvix.app

concurrency:
  group: quality-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Test application and security boundaries
        run: npm run test:unit && npm run test:integration && npm run test:security && npm run test:cron
      - name: Build production application
        run: npm run build

  e2e:
    if: github.event_name != 'schedule'
    needs: application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run isolated browser journeys
        run: npm run test:e2e

  tls:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.21.0
          package-manager-cache: false
      - name: Verify public certificates and HTTPS redirects
        run: node scripts/check-tls.mjs
