# Include inside http {}, NOT server {}. Immediate writes for Fail2ban.
map $uri $is_decoy_probe {
    default 0;
    ~*^/+.*(?:wp-includes|wlwmanifest\.xml) 1;
    ~*^/(?:wp-admin(?:/|$)|wp-login\.php(?:/|$)|wordpress(?:/|$)|(?:info|pinfo|phpinfo|test|env|index)\.php$|api/(?:pinfo|phpinfo)\.php$|credentials?(?:\.(?:json|ya?ml|txt))?$|graphql(?:/|$)|api/gql(?:/|$)|admin/[^/]+\.json$|actuator(?:/|$)|\.well-known/security\.txt$|storage/logs(?:/|$)|zzcanary-[^/]*\.xml$|(?:.*/)?\.(?:env|git|vscode|idea|svn)(?:[./]|$)|(?:.*/)?env-config[^/]*$|(?:.*/)?fly\.toml$|(?:.*/)?[^/]*wlwmanifest[^/]*\.xml$|.*\.(?:toml|local|staging)$) 1;
}
map $is_decoy_probe $log_regular_access {
    default 1;
    1 0;
}

# Shared HTTP-context controls used by deploy/nginx.conf. Empty map keys are
# not counted by limit_req, so the strict bucket applies only to authentication
# mutations while the wider bucket protects every request.
map $uri $renvix_auth_limit_key {
    default "";
    ~*^/api/auth/(?:login|register|forgot-password|reset-password|verify-reset-code|email-otp/(?:resend|verify)|mfa/verify)$ $binary_remote_addr;
    ~*^/api/admin/(?:login|auth/(?:login|forgot-password|reset-password))$ $binary_remote_addr;
}
map $http_upgrade $connection_upgrade {
    default upgrade;
    # An empty Connection header lets Nginx reuse pooled upstream sockets.
    "" "";
}

limit_conn_zone $binary_remote_addr zone=renvix_per_ip:10m;
limit_req_zone $binary_remote_addr zone=renvix_general:10m rate=30r/s;
limit_req_zone $renvix_auth_limit_key zone=renvix_auth:10m rate=20r/m;

log_format decoy_probe '$remote_addr [$time_local] probe status=$status';
# Add this access_log in each protected server {} alongside its normal log:
# access_log /var/log/nginx/honeypot-probes.log decoy_probe if=$is_decoy_probe;
